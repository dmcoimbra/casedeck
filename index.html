<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<title>casedeck</title>
<style>
  :root{color-scheme:light dark;--bg:#f4f6f5;--ink:#121a17;--mut:#69766f}
  @media (prefers-color-scheme:dark){:root{--bg:#0e1412;--ink:#eef3f0;--mut:#8a9a93}}
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bg);color:var(--ink);
       font-family:-apple-system,"Segoe UI",system-ui,sans-serif;padding:32px}
  main{text-align:center;max-width:34ch}
  h1{margin:0;font-size:19px;font-weight:650;letter-spacing:.14em;text-transform:lowercase}
  p{margin:10px 0 0;font-size:13.5px;color:var(--mut);line-height:1.6}
</style>
</head>
<body>
  <main>
    <h1>casedeck</h1>
    <p>Ambiente de publicação de materiais. O acesso é feito pelo endereço específico de cada projeto.</p>
  </main>
</body>
</html>
