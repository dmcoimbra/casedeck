<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>75 | BOX FINANCEIRO</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<style>
:root{--bg:#0D0D0A;--card:#161613;--ink:#F2F1E9;--muted:#A5A290;--line:#2C2C24;--lime:#C0EE4E;--neg:#EA6440}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,sans-serif;padding:20px}
.box{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:34px 32px;max-width:400px;width:100%}
.mark{font-weight:900;font-size:26px;letter-spacing:.03em;text-transform:uppercase;margin-bottom:4px}
.mark b{color:var(--lime)}
.sub{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin-bottom:26px}
label{display:block;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin:14px 0 6px}
input{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:8px;color:var(--ink);padding:11px 12px;font-size:15px}
input:focus-visible{outline:2px solid var(--lime)}
button{width:100%;margin-top:22px;background:var(--lime);color:#14140F;border:none;border-radius:8px;padding:12px;font-size:15px;font-weight:700;cursor:pointer}
button:disabled{opacity:.6;cursor:wait}
.err{color:var(--neg);font-size:13.5px;margin-top:12px;min-height:18px}
.note{color:var(--muted);font-size:12px;margin-top:18px}
</style>
</head>

  <input id="p" type="password" autocomplete="current-password" required>

  const plain = await crypto.subtle.decrypt({name:'AES-GCM', iv:ub(IV)}, key, ct);
  const html = new TextDecoder().decode(plain);
  try{ sessionStorage.setItem('boxAuth', JSON.stringify({l:login.trim(), p:pass})); }catch(e){}
  document.open(); document.write(html); document.close();
}
document.getElementById('f').addEventListener('submit', async ev => {
  ev.preventDefault();
  const b = document.getElementById('b'), e = document.getElementById('e');
  b.disabled = true; b.textContent = 'Abrindo…'; e.textContent = '';
  try { await tryOpen(document.getElementById('l').value, document.getElementById('p').value); }
  catch(err){
    e.textContent = err && err.msg ? err.msg : 'Login ou senha incorretos.';
    b.disabled = false; b.textContent = 'Entrar';
  }
});
try {
  const a = JSON.parse(sessionStorage.getItem('boxAuth'));
  if (a && a.p) tryOpen(a.l, a.p).catch(() => { try{sessionStorage.removeItem('boxAuth');}catch(e){} });
} catch (e) {}
</script>
